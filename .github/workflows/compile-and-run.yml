name: Compile and Run UnBasedCode

on:
  push:
    branches: [ main, issue-3-fe6bf2ec718c ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref_name }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Free Pascal Compiler
      run: |
        choco install freepascal -y

    - name: Compile and run UnBasedCode.dpr
      shell: bash
      run: |
        chmod +x compile_and_run.sh
        ./compile_and_run.sh > output.txt 2>&1 || true

    - name: Display output
      if: always()
      shell: bash
      run: cat output.txt

    - name: Upload output as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-output
        path: output.txt
