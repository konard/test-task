name: Compile and Run UnBasedCode

on:
  push:
    branches: [ main, issue-3-fe6bf2ec718c ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref_name }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Free Pascal Compiler
      run: |
        choco install freepascal -y

    # TEMPORARILY DISABLED: Free Pascal compilation fails with type incompatibility
