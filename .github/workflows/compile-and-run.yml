name: Compile and Run UnBasedCode

on:
  push:
    branches: [ main, issue-3-fe6bf2ec718c ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Free Pascal Compiler
      run: |
        choco install freepascal -y

    - name: Compile and run UnBasedCode.dpr
      shell: bash
      run: |
        chmod +x compile_and_run.sh
        ./compile_and_run.sh > output.txt 2>&1 || true

    - name: Display output
      if: always()
      shell: bash
      run: cat output.txt

    - name: Commit output.txt to repository
      if: always()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add output.txt
        git diff --staged --quiet || git commit -m "Add execution output from Windows CI"
        git push || true

    - name: Upload output as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-output
        path: output.txt
