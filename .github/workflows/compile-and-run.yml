    - name: Compile and run UnBasedCode.dpr with type-cast fix
      shell: bash
      run: |
        # Create a fixed version with explicit type casting for Free Pascal
        # Remove the {$R *.res} directive and add type casting
        sed -e 's/Code := @data\[0\];/Code := T(@data[0]);/' \
            -e 's/{$R \*\.res}//' \
            UnBasedCode.dpr > UnBasedCode_fixed.dpr

        # Find FPC compiler
        FPC_PATH=$(find /c/tools/freepascal -name "fpc.exe" 2>/dev/null | head -n 1)
        if [ -z "$FPC_PATH" ]; then
          echo "Error: Free Pascal Compiler not found"
          exit 1
        fi

        # Compile the fixed version
        "$FPC_PATH" -Twin32 -Mdelphi UnBasedCode_fixed.dpr > output.txt 2>&1
        COMPILE_EXIT=$?

        if [ $COMPILE_EXIT -eq 0 ] && [ -f "UnBasedCode_fixed.exe" ]; then
          echo "Compilation successful!" >> output.txt
          echo "" >> output.txt
          echo "Executing UnBasedCode_fixed.exe..." >> output.txt
          ./UnBasedCode_fixed.exe >> output.txt 2>&1 || true
        else
          echo "Compilation failed with exit code: $COMPILE_EXIT" >> output.txt
        fi

    - name: Display output
      if: always()
      shell: bash
      run: cat output.txt

    - name: Upload output as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-output
        path: output.txt
